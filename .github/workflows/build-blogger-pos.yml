name: Build Blogger POS Template

on:
  push:
    branches:
      - blogger-pos-conversion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blogger-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare static Blogger build
        env:
          GOOGLE_CLIENT_ID: 726581421832-e11iuddppu9ah63gmmou7qc7pfdckl20.apps.googleusercontent.com
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('src/utils/googleSheetsService.ts')
          s = p.read_text()
          old = """export function getGoogleClientId(): string {\n  if (typeof window !== 'undefined' && window.gapi_client_id) {\n    return window.gapi_client_id;\n  }\n  return localStorage.getItem('mamjista_custom_google_client_id') || '';\n}"""
          new = """export function getGoogleClientId(): string {\n  if (typeof window !== 'undefined' && window.gapi_client_id) {\n    return window.gapi_client_id;\n  }\n  return localStorage.getItem('mamjista_custom_google_client_id') || '""" + os.environ['GOOGLE_CLIENT_ID'] + """';\n}"""
          if old not in s: raise SystemExit('Could not find Google client ID function')
          p.write_text(s.replace(old, new))
          p = Path('src/utils/storage.ts')
          s = p.read_text()
          pattern = re.compile(r"export async function syncWithBackend\(data: \{.*?\n\}\n\nexport function downloadCSV", re.S)
          replacement = """export async function syncWithBackend(data: {\n  sales?: Invoice[]; inventory?: Product[]; suppliers?: Supplier[]; customers?: Customer[];\n  cashBook?: CashTransaction[]; wholesaleOrders?: WholesaleOrder[]; fieldPayments?: FieldPaymentReceipt[];\n}): Promise<{ success: boolean; message: string; timestamp?: string }> {\n  void data;\n  return { success: false, message: 'Local browser storage active. Use Google Sheets Live Cloud Backup for cloud synchronization.' };\n}\n\nexport function downloadCSV"""
          s2, n = pattern.subn(replacement, s)
          if n != 1: raise SystemExit(f'Could not replace backend sync function: {n}')
          p.write_text(s2)
          PY
      - name: Build frontend
        run: npx vite build --base=./
      - name: Generate Blogger XML theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          js_files = list((dist/'assets').glob('*.js'))
          css_files = list((dist/'assets').glob('*.css'))
          if len(js_files) != 1: raise SystemExit(f'Expected exactly one JS bundle, found {len(js_files)}')
          if len(css_files) != 1: raise SystemExit(f'Expected exactly one CSS bundle, found {len(css_files)}')
          js = js_files[0].read_text(); css = css_files[0].read_text()
          def cdata(x): return '<![CDATA[' + x.replace(']]>', ']]]]><![CDATA[>') + ']]>'
          xml = f'''<?xml version="1.0" encoding="UTF-8" ?>
          <!DOCTYPE html>
          <html b:version='2' class='v2' expr:dir='data:blog.languageDirection'
                xmlns='http://www.w3.org/1999/xhtml'
                xmlns:b='http://www.google.com/2005/gml/b'
                xmlns:data='http://www.google.com/2005/gml/data'
                xmlns:expr='http://www.google.com/2005/gml/expr'>
          <head>
            <meta charset='UTF-8'/>
            <meta content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no' name='viewport'/>
            <meta content='noindex,nofollow' name='robots'/>
            <title>Mamjista Food Products POS</title>
            <b:include data='blog' name='all-head-content'/>
            <script src='https://accounts.google.com/gsi/client' async='async' defer='defer'></script>
            <style type='text/css'>{cdata(css)}</style>
          </head>
          <body>
            <div id='root'></div>
            <b:section id='bloggerHidden' class='main' maxwidgets='1' showaddelement='no'/>
            <script type='text/javascript'>{cdata(js)}</script>
          </body>
          </html>'''
          Path('blogger-template.xml').write_text(xml, encoding='utf-8')
          PY
      - name: Commit generated Blogger XML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blogger-template.xml
          git diff --cached --quiet || git commit -m 'Generate Blogger POS XML [skip ci]'
          git push
      - name: Upload XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: mamjista-blogger-pos
          path: blogger-template.xml
          if-no-files-found: error
